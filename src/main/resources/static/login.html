<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Sign In - ParkWave</title>
  <!-- Google Fonts & Lucide CDN -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      /* Theme variables - DEFAULT DARK (Uber Pure Black) */
      --bg-color: #000000;
      --card-bg: #121212;
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #ffffff;
      --text-muted: #a0a0a0;
      --accent: #276EF1; /* Uber Royal Blue */
      --accent-light: #5B92FF;
      --success: #10B981;
      --success-bg: rgba(16, 185, 129, 0.1);
      --danger: #EF4444;
      --danger-bg: rgba(239, 68, 68, 0.1);
      
      --ribbon-bg: #121212;
      --ribbon-border: rgba(255, 255, 255, 0.08);
      
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      --font-family: 'Plus Jakarta Sans', sans-serif;
    }

    html.light {
      /* LIGHT THEME */
      --bg-color: #ffffff;
      --card-bg: #f6f6f6;
      --card-border: rgba(0, 0, 0, 0.08);
      --text-main: #000000;
      --text-muted: #5f5f5f;
      --accent: #000000;
      --accent-light: #333333;
      --success: #10B981;
      --success-bg: rgba(16, 185, 129, 0.08);
      --danger: #EF4444;
      --danger-bg: rgba(239, 68, 68, 0.08);
      
      --ribbon-bg: #ffffff;
      --ribbon-border: rgba(0, 0, 0, 0.08);
      
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      background-color: #0c0d12;
      font-family: var(--font-family);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background-color 0.3s ease;
    }

    html.light body {
      background-color: #f0f2f5;
    }

    .app-shell {
      width: 100%;
      max-width: 480px;
      height: 100%;
      height: 100dvh;
      position: relative;
      background-color: var(--bg-color);
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
    }

    html.light .app-shell {
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.12);
    }

    .app-header {
      height: 64px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      border-bottom: 1px solid var(--card-border);
      z-index: 10;
      flex-shrink: 0;
    }

    .app-header .logo {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.3rem;
      letter-spacing: -0.03em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-car {
      background: var(--accent);
      color: #ffffff;
      padding: 6px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.3s ease;
    }

    html.light .logo-car {
      background: #000000;
    }

    .theme-toggle {
      background: transparent;
      border: none;
      color: var(--text-main);
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      border-radius: 8px;
      transition: background-color 0.2s ease;
    }

    .app-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      padding-top: 40px;
      -webkit-overflow-scrolling: touch;
    }

    .app-content::-webkit-scrollbar {
      display: none;
    }

    /* Auth card forms */
    .auth-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 6px;
      letter-spacing: -0.03em;
      text-align: center;
    }

    .auth-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 32px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .input-wrapper {
      position: relative;
    }

    .form-input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 500;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(39, 110, 241, 0.15);
    }

    .form-input::placeholder {
      color: var(--text-muted);
      opacity: 0.5;
    }

    /* Error indicator box */
    .error-alert-box {
      background: var(--danger-bg);
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 20px;
      display: none;
    }

    .btn-submit {
      width: 100%;
      background: var(--text-main);
      color: var(--bg-color);
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s ease;
      margin-top: 10px;
    }

    .btn-submit:active {
      opacity: 0.85;
    }

    .auth-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .auth-footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
    }
    
    html.light .auth-footer a {
      color: #000000;
    }

    .back-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-decoration: none;
      margin-top: 20px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="app-shell">
    
    <header class="app-header">
      <div class="logo" onclick="window.location.href='index.html'" style="cursor: pointer;">
        <span class="logo-car">
          <i data-lucide="car" style="width: 18px; height: 18px; stroke-width: 2.5;"></i>
        </span>
        ParkWave
      </div>
      <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Theme">
        <i data-lucide="sun" id="theme-icon-sun" style="display: none;"></i>
        <i data-lucide="moon" id="theme-icon-moon"></i>
      </button>
    </header>

    <main class="app-content">
      <div class="auth-title">Welcome Back</div>
      <div class="auth-subtitle">Sign in to lock secure floor slots seamlessly</div>

      <div class="error-alert-box" id="error-box"></div>

      <form onsubmit="handleLoginSubmit(event)">
        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-wrapper">
            <input type="email" id="email" class="form-input" placeholder="name@domain.com" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
          </div>
        </div>

        <button type="submit" class="btn-submit">
          Sign In
          <i data-lucide="arrow-right" style="width: 16px; height: 16px;"></i>
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="register.html">Sign Up</a>
        
        <a href="index.html" class="back-btn">
          <i data-lucide="arrow-left" style="width: 14px; height: 14px;"></i>
          Back to Homepage
        </a>
      </div>
    </main>

  </div>

  <script>
    // Theme triggers
    function initTheme() {
      const savedTheme = localStorage.getItem("theme") || "dark";
      const htmlEl = document.documentElement;
      const sunIcon = document.getElementById("theme-icon-sun");
      const moonIcon = document.getElementById("theme-icon-moon");

      if (savedTheme === "light") {
        htmlEl.classList.add("light");
        if (sunIcon) sunIcon.style.display = "block";
        if (moonIcon) moonIcon.style.display = "none";
      } else {
        htmlEl.classList.remove("light");
        if (sunIcon) sunIcon.style.display = "none";
        if (moonIcon) moonIcon.style.display = "block";
      }
    }
    initTheme();

    function toggleTheme() {
      const htmlEl = document.documentElement;
      const sunIcon = document.getElementById("theme-icon-sun");
      const moonIcon = document.getElementById("theme-icon-moon");

      if (htmlEl.classList.contains("light")) {
        htmlEl.classList.remove("light");
        localStorage.setItem("theme", "dark");
        if (sunIcon) sunIcon.style.display = "none";
        if (moonIcon) moonIcon.style.display = "block";
      } else {
        htmlEl.classList.add("light");
        localStorage.setItem("theme", "light");
        if (sunIcon) sunIcon.style.display = "block";
        if (moonIcon) moonIcon.style.display = "none";
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
    });

    function showError(msg) {
      const box = document.getElementById("error-box");
      box.textContent = msg;
      box.style.display = "block";
    }

    // Login submit action
    function handleLoginSubmit(event) {
      event.preventDefault();
      const emailInput = document.getElementById("email").value;
      const passwordInput = document.getElementById("password").value;
      const box = document.getElementById("error-box");
      
      box.style.display = "none";

      fetch("/api/users/login-with-id", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: emailInput,
          password: passwordInput
        })
      })
      .then(res => {
        if (!res.ok) throw new Error("Invalid username or password");
        return res.json();
      })
      .then(user => {
        if (user) {
          localStorage.setItem("userEmail", user.email);
          localStorage.setItem("userId", user.id);
          window.location.href = "profile.html";
        } else {
          showError("Invalid email or password");
        }
      })
      .catch(() => showError("Invalid email or password"));
    }
  </script>
</body>
</html>
