<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - ParkWave</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');

    :root {
      --primary: #4f46e5;
      --primary-light: #818cf8;
      --secondary: #ec4899;
      --dark-bg: #090d16;
      --glass-bg: rgba(17, 24, 39, 0.7);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--dark-bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      padding: 20px;
    }

    /* Glowing blur blobs */
    .blob {
      position: absolute;
      width: 350px;
      height: 350px;
      border-radius: 50%;
      filter: blur(100px);
      z-index: -1;
      opacity: 0.35;
      animation: float 10s infinite alternate ease-in-out;
    }

    .blob-1 {
      background: var(--primary);
      top: -50px;
      left: -50px;
    }

    .blob-2 {
      background: var(--secondary);
      bottom: -80px;
      right: -50px;
      animation-delay: 3s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, 40px) scale(1.15); }
    }

    .login-container {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      padding: 40px 30px;
      border-radius: 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
      z-index: 10;
      animation: slideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideIn {
      0% { transform: translateY(30px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-badge {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin: 0 auto 16px auto;
      box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
    }

    .header h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      color: white;
      margin-bottom: 8px;
    }

    .header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .input-wrapper {
      position: relative;
    }

    .form-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 14px 16px;
      color: white;
      font-family: inherit;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary-light);
      background: rgba(255, 255, 255, 0.07);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
    }

    .form-input::placeholder {
      color: rgba(255, 255, 255, 0.25);
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, var(--primary) 0%, #6366f1 100%);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(79, 70, 229, 0.4);
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(79, 70, 229, 0.6);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .footer-links {
      margin-top: 24px;
      text-align: center;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .footer-links a {
      color: var(--primary-light);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .footer-links a:hover {
      color: white;
    }
  </style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="login-container">
    <div class="header">
      <div class="logo-badge">🚗</div>
      <h2>Welcome Back</h2>
      <p>Sign in to access your parking dashboard</p>
    </div>

    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <input type="email" id="email" class="form-input" placeholder="name@domain.com" required autocomplete="email">
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
        </div>
      </div>

      <button type="submit" class="btn-submit">
        Sign In ➔
      </button>
    </form>

    <div class="footer-links">
      Don't have an account? <a href="register.html">Sign up</a>
      <div style="margin-top: 12px;">
        <a href="index.html" style="font-size: 0.85rem; color: var(--text-muted);">← Back to Landing Page</a>
      </div>
    </div>
  </div>

  <script>
    function handleLogin(event) {
      event.preventDefault();
      const emailInput = document.getElementById("email").value;
      const passwordInput = document.getElementById("password").value;

      fetch("/api/users/login-with-id", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
              email: emailInput,
              password: passwordInput
          })
      })
      .then(res => {
          if (!res.ok) throw new Error("Invalid credentials");
          return res.json();
      })
      .then(user => {
          if (user) {
              localStorage.setItem("userEmail", user.email);
              localStorage.setItem("userId", user.id);
              alert("Login successful!");
              window.location.href = "mall-selection.html";
          } else {
              alert("Invalid email or password");
          }
      })
      .catch(() => alert("Invalid email or password"));
    }
  </script>

</body>
</html>
