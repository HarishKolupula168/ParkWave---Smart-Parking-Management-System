<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Parking Map - ParkWave</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');

    :root {
      --primary: #4f46e5;
      --primary-light: #818cf8;
      --secondary: #ec4899;
      --accent: #10b981;
      --danger: #ef4444;
      --dark-bg: #090d16;
      --glass-bg: rgba(17, 24, 39, 0.7);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--dark-bg);
      color: var(--text-main);
      min-height: 100vh;
      position: relative;
      padding: 40px 20px;
      overflow-x: hidden;
    }

    /* Glowing blur blobs */
    .blob {
      position: absolute;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      filter: blur(130px);
      z-index: -1;
      opacity: 0.35;
      animation: float 14s infinite alternate ease-in-out;
    }

    .blob-1 {
      background: var(--primary);
      top: -100px;
      left: -100px;
    }

    .blob-2 {
      background: var(--secondary);
      bottom: -150px;
      right: -100px;
      animation-delay: 3s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(50px, 60px) scale(1.25); }
    }

    .container {
      max-width: 1300px;
      margin: 0 auto;
      position: relative;
      z-index: 10;
    }

    /* Unified Responsive Nav Bar */
    .user-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      padding: 16px 24px;
      border-radius: 16px;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }

    .user-status {
      font-size: 0.95rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .btn-glass {
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--glass-border);
      color: var(--text-main);
    }

    .btn-glass:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-2px);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary) 0%, #6366f1 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(79, 70, 229, 0.5);
    }

    .btn-danger {
      background: linear-gradient(135deg, var(--danger) 0%, #dc2626 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
    }

    .btn-danger:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(239, 68, 68, 0.5);
    }

    /* Mall Map Header Info Box */
    .mall-header-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      padding: 30px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .mall-meta h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      color: white;
      margin-bottom: 8px;
    }

    .mall-meta p {
      color: var(--text-muted);
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bookings-link-btn {
      background: linear-gradient(135deg, var(--secondary) 0%, #db2777 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3);
    }

    .bookings-link-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(236, 72, 153, 0.5);
    }

    /* Level Selector Tabs */
    .level-tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .level-tab {
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-muted);
      border: 1px solid var(--glass-border);
      padding: 12px 24px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
      font-size: 0.9rem;
    }

    .level-tab.active {
      background: linear-gradient(135deg, var(--primary) 0%, #6366f1 100%);
      color: white;
      border-color: transparent;
      box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
    }

    .level-tab:hover {
      background: rgba(255, 255, 255, 0.08);
      color: white;
    }

    /* Map Layout */
    .map-container {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 40px 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      margin-bottom: 40px;
    }

    .entry-exit-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
      margin: 20px 0;
      gap: 8px;
    }

    .entry-exit-bar.entrance {
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .entry-exit-bar.exit {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .road {
      background: #111827;
      height: 48px;
      border-radius: 10px;
      margin: 24px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .road::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 3px;
      background: repeating-linear-gradient(
        90deg,
        #f59e0b 0px,
        #f59e0b 20px,
        transparent 20px,
        transparent 40px
      );
      transform: translateY(-50%);
      opacity: 0.8;
    }

    .road-label {
      color: #f59e0b;
      font-weight: 700;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      z-index: 2;
      background: #111827;
      padding: 4px 12px;
      border-radius: 4px;
    }

    .parking-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(95px, 1fr));
      gap: 14px;
      margin: 24px 0;
    }

    /* Interactive Slots - Toggles Colors only */
    .slot {
      height: 120px;
      border: 2px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', sans-serif;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .slot-num {
      font-size: 1.2rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .slot-state {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      opacity: 0.8;
      letter-spacing: 0.05em;
    }

    .slot-zone-tag {
      font-size: 0.7rem;
      background: rgba(255, 255, 255, 0.15);
      padding: 2px 8px;
      border-radius: 4px;
      margin-top: 6px;
      font-weight: 600;
    }

    /* Colors and states - static list toggling */
    .slot.available {
      background: rgba(16, 185, 129, 0.12);
      border-color: var(--accent);
      color: var(--accent);
    }

    .slot.available:hover {
      background: rgba(16, 185, 129, 0.22);
      transform: scale(1.04) translateY(-3px);
      box-shadow: 0 8px 25px rgba(16, 185, 129, 0.25);
    }

    /* Generic booked by other users */
    .slot.booked {
      background: rgba(239, 68, 68, 0.08);
      border-color: var(--danger);
      color: var(--danger);
    }

    .slot.booked:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.15);
    }

    /* Explicit user slot lock style */
    .slot.locked-by-me {
      background: rgba(79, 70, 229, 0.2);
      border-color: var(--primary-light);
      color: white;
      box-shadow: 0 0 15px rgba(79, 70, 229, 0.35);
      animation: slotPulse 1.8s infinite alternate ease-in-out;
    }

    .slot.locked-by-me:hover {
      background: rgba(79, 70, 229, 0.3);
      transform: scale(1.04) translateY(-3px);
      box-shadow: 0 8px 30px rgba(79, 70, 229, 0.55);
    }

    @keyframes slotPulse {
      0% { border-color: var(--primary-light); }
      100% { border-color: var(--secondary); }
    }

    /* Map Legend */
    .legend {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin: 30px 0;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .legend-color {
      width: 20px;
      height: 20px;
      border-radius: 6px;
    }

    /* Road networks */
    .connecting-road {
      background: #111827;
      height: 24px;
      border-radius: 6px;
      grid-column: 1 / -1;
      position: relative;
    }

    .connecting-road::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 2px;
      background: repeating-linear-gradient(
        90deg,
        #f59e0b 0px,
        #f59e0b 10px,
        transparent 10px,
        transparent 20px
      );
      transform: translateY(-50%);
      opacity: 0.6;
    }

    .vertical-road {
      background: #111827;
      width: 24px;
      border-radius: 6px;
      position: relative;
      grid-row: span 2;
    }

    .vertical-road::before {
      content: '';
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 2px;
      background: repeating-linear-gradient(
        0deg,
        #f59e0b 0px,
        #f59e0b 10px,
        transparent 10px,
        transparent 20px
      );
      transform: translateX(-50%);
      opacity: 0.6;
    }

    /* PREMIUM CUSTOM TOAST NOTIFICATIONS */
    .toast-container {
      position: fixed;
      top: 30px;
      right: 30px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 1000;
      max-width: 380px;
      width: calc(100% - 60px);
    }

    .toast {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      padding: 16px 20px;
      border-radius: 14px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
      color: white;
      font-size: 0.9rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 12px;
      animation: toastSlideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      transition: all 0.3s ease;
    }

    .toast.success { border-color: var(--accent); background: rgba(16, 185, 129, 0.15); }
    .toast.error { border-color: var(--danger); background: rgba(239, 68, 68, 0.15); }

    @keyframes toastSlideIn {
      0% { transform: translateY(-20px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    .toast-close {
      margin-left: auto;
      cursor: pointer;
      opacity: 0.6;
    }

    .toast-close:hover { opacity: 1; }

    /* PREMIUM GLASSMORPHIC DIALOG MODALS */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
    }

    .modal-content {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 36px 30px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 25px 60px rgba(0,0,0,0.5);
      animation: modalScaleIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes modalScaleIn {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .modal-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.4rem;
      font-weight: 800;
      color: white;
      margin-bottom: 12px;
    }

    .modal-text {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .modal-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 12px 16px;
      color: white;
      font-family: inherit;
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    .modal-input:focus {
      outline: none;
      border-color: var(--primary-light);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    @media (max-width: 768px) {
      .user-nav {
        flex-direction: column;
        gap: 16px;
        text-align: center;
      }
      
      .mall-header-card {
        flex-direction: column;
        align-items: stretch;
      }

      .bookings-link-btn {
        width: 100%;
        justify-content: center;
      }

      .parking-grid {
        grid-template-columns: repeat(auto-fit, minmax(75px, 1fr));
      }

      .slot {
        height: 95px;
      }
    }
  </style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Interactive Confirmation Dialog Modal -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal-content">
      <div class="modal-title" id="confirmTitle">Confirm Action</div>
      <div class="modal-text" id="confirmText">Are you sure you want to proceed?</div>
      <div class="modal-actions">
        <button class="btn btn-glass" onclick="closeConfirmModal(false)">Cancel</button>
        <button class="btn btn-primary" id="confirmBtn">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Guest Input Dialog Modal -->
  <div class="modal-overlay" id="promptModal">
    <div class="modal-content">
      <div class="modal-title" id="promptTitle">Guest Booking</div>
      <div class="modal-text" id="promptText">Please enter your name:</div>
      <input type="text" id="promptInput" class="modal-input" placeholder="Your Name">
      <div class="modal-actions">
        <button class="btn btn-glass" onclick="closePromptModal(false)">Cancel</button>
        <button class="btn btn-primary" id="promptBtn">Submit</button>
      </div>
    </div>
  </div>

  <div class="container">
    
    <!-- User Status Navigation Bar -->
    <div class="user-nav">
      <div class="user-status">
        <span>👤</span>
        <span id="userStatus">Browsing as Guest</span>
      </div>
      <div class="nav-actions">
        <a href="index.html" class="btn btn-glass">Home</a>
        <a href="mall-selection.html" class="btn btn-glass">Change Mall</a>
        <button onclick="handleLogout()" id="logoutBtn" class="btn btn-danger" style="display:none;">Sign Out</button>
        <a href="login.html" id="signInBtn" class="btn btn-primary">Sign In</a>
      </div>
    </div>

    <!-- Mall Metadata Header Card -->
    <div class="mall-header-card">
      <div class="mall-meta">
        <h2 id="mallName">Loading Mall...</h2>
        <p id="mallDetails">Loading information...</p>
      </div>
      <button class="btn bookings-link-btn" onclick="viewBookings()">📋 View My Bookings</button>
    </div>

    <!-- Level Tabs -->
    <div class="level-tabs" id="levelTabs"></div>

    <!-- Map Legend -->
    <div class="legend">
      <div class="legend-item">
        <div class="legend-color" style="background: rgba(16, 185, 129, 0.2); border: 2px solid var(--accent);"></div>
        <span>Available</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background: rgba(239, 68, 68, 0.1); border: 2px solid var(--danger);"></div>
        <span>Booked</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background: rgba(79, 70, 229, 0.3); border: 2px solid var(--primary-light);"></div>
        <span>Booked by You (Locked)</span>
      </div>
    </div>

    <!-- Main Map Area -->
    <div class="map-container">
      <div class="entry-exit-bar entrance">⬇ ENTRANCE ROAD</div>
      <div class="road"><span class="road-label">Access Highway</span></div>

      <!-- Real-Time Slots Grid -->
      <div class="parking-grid" id="parkingGrid"></div>

      <div class="road"><span class="road-label">Exit Route</span></div>
      <div class="entry-exit-bar exit">⬆ EXIT ROAD</div>
    </div>

  </div>

  <script>
    const mallId = localStorage.getItem("selectedMallId");
    const userId = localStorage.getItem("userId");
    let currentLevel = 1;
    let mallData = null;
    let myActiveBookings = [];

    // CUSTOM TOAST NOTIFICATION HANDLER
    function showToast(message, type = "success") {
      const container = document.getElementById("toastContainer");
      const toast = document.createElement("div");
      toast.className = `toast ${type}`;
      toast.innerHTML = `
        <span>${type === 'success' ? '✓' : '✗'}</span>
        <div>${message}</div>
        <span class="toast-close" onclick="this.parentElement.remove()">×</span>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = "0";
        setTimeout(() => toast.remove(), 400);
      }, 4000);
    }

    // CUSTOM DIALOG WINDOWS
    let confirmResolver = null;
    function customConfirm(title, text) {
      document.getElementById("confirmTitle").textContent = title;
      document.getElementById("confirmText").textContent = text;
      document.getElementById("confirmModal").style.display = "flex";
      return new Promise((resolve) => {
        confirmResolver = resolve;
      });
    }

    function closeConfirmModal(accepted) {
      document.getElementById("confirmModal").style.display = "none";
      if (confirmResolver) confirmResolver(accepted);
    }

    document.getElementById("confirmBtn").onclick = () => closeConfirmModal(true);

    let promptResolver = null;
    function customPrompt(title, text) {
      document.getElementById("promptTitle").textContent = title;
      document.getElementById("promptText").textContent = text;
      document.getElementById("promptInput").value = "";
      document.getElementById("promptModal").style.display = "flex";
      document.getElementById("promptInput").focus();
      return new Promise((resolve) => {
        promptResolver = resolve;
      });
    }

    function closePromptModal(accepted) {
      document.getElementById("promptModal").style.display = "none";
      if (promptResolver) {
        const val = document.getElementById("promptInput").value.trim();
        promptResolver(accepted ? val : null);
      }
    }

    document.getElementById("promptBtn").onclick = () => closePromptModal(true);

    // Dynamic Navigation Bar Check
    document.addEventListener("DOMContentLoaded", () => {
      const email = localStorage.getItem("userEmail");
      if (email) {
        document.getElementById("userStatus").innerHTML = `Signed in as: <strong style="color: var(--primary-light);">${email}</strong>`;
        document.getElementById("logoutBtn").style.display = "block";
        document.getElementById("signInBtn").style.display = "none";
      }
      
      // Load mall information and sync bookings first
      syncSessionAndLoad();
    });

    // Sync bookings locally and pull active ones
    function syncSessionAndLoad() {
      // 1. Fetch user or guest active bookings to flag them as "Locked by Me"
      let fetchUrl = userId ? `/api/mall-bookings/user/${userId}/active` : `/api/mall-bookings/mall/${mallId}`;
      
      fetch(fetchUrl)
        .then(res => res.json())
        .then(data => {
          if (userId) {
            myActiveBookings = data;
          } else {
            // Guest mode - filter by locally cached active IDs
            const cachedIds = JSON.parse(localStorage.getItem("guestActiveBookingIds") || "[]");
            myActiveBookings = data.filter(b => b.status === "ACTIVE" && cachedIds.includes(b.id));
          }
          
          // 2. Load Mall details
          return fetch(`/api/malls/${mallId}`);
        })
        .then(res => res.json())
        .then(mall => {
          mallData = mall;
          document.getElementById("mallName").textContent = mall.name;
          document.getElementById("mallDetails").textContent = 
            `${mall.location} | Total Slots: ${mall.totalSlots} | Floors: ${mall.parkingLevels}`;
          
          // Generate level tabs
          createLevelTabs(mall.parkingLevels);
          
          // Initial map load
          loadParkingSlots(currentLevel);
        })
        .catch(() => showToast("Failed to load map data. Please reload.", "error"));
    }

    function createLevelTabs(levels) {
      const container = document.getElementById("levelTabs");
      container.innerHTML = "";
      for (let i = 1; i <= levels; i++) {
        const button = document.createElement("button");
        button.className = `level-tab ${i === currentLevel ? 'active' : ''}`;
        button.textContent = `Floor ${i}`;
        button.onclick = () => {
          currentLevel = i;
          document.querySelectorAll(".level-tab").forEach((tab, index) => {
            tab.className = `level-tab ${index + 1 === i ? 'active' : ''}`;
          });
          loadParkingSlots(i);
        };
        container.appendChild(button);
      }
    }

    // STATIC LOAD - ONLY TOGGLES CLASSES ON REDRAW
    function loadParkingSlots(level) {
      fetch(`/api/mall-parking/slots/${mallId}/level/${level}`)
        .then(res => res.json())
        .then(slots => {
          const container = document.getElementById("parkingGrid");
          container.innerHTML = "";

          const slotsPerRow = 9;
          const totalRows = Math.ceil(slots.length / slotsPerRow);

          for (let row = 0; row < totalRows; row++) {
            if (row > 0) {
              const road = document.createElement("div");
              road.className = "connecting-road";
              container.appendChild(road);
            }

            const startIdx = row * slotsPerRow;
            const endIdx = Math.min(startIdx + slotsPerRow, slots.length);

            for (let i = startIdx; i < endIdx; i++) {
              const slot = slots[i];
              const div = document.createElement("div");
              
              // Determine if slot is locked by current user
              const activeBooking = myActiveBookings.find(b => b.parkingSlot.id === slot.id && b.status === "ACTIVE");
              
              let statusClass = "available";
              let statusLabel = "Available";
              
              if (activeBooking) {
                statusClass = "locked-by-me";
                statusLabel = "Your Slot";
              } else if (slot.status === "BOOKED") {
                statusClass = "booked";
                statusLabel = "Booked";
              }

              div.className = `slot ${statusClass}`;
              div.id = `slot-${slot.id}`;
              
              div.innerHTML = `
                <div class="slot-num">${slot.slotNumber}</div>
                <div class="slot-state">${statusLabel}</div>
                <div class="slot-zone-tag">${slot.zone}</div>
              `;

              // Dynamically configure static toggle clicks
              if (activeBooking) {
                div.onclick = () => openBookingManager(activeBooking.id, slot.id, slot.slotNumber);
                div.title = `Manage your booking for slot ${slot.slotNumber}`;
              } else if (slot.status === "AVAILABLE") {
                div.onclick = () => triggerSlotBooking(slot.id, slot.slotNumber);
                div.title = `Click to book slot ${slot.slotNumber}`;
              } else {
                div.onclick = () => showToast(`Slot ${slot.slotNumber} is booked by another user.`, "error");
                div.title = `Slot ${slot.slotNumber} is fully occupied`;
              }

              container.appendChild(div);

              // Inject vertical layout dividers
              const colInRow = (i - startIdx + 1);
              if (colInRow === 3 || colInRow === 6) {
                const verticalRoad = document.createElement("div");
                verticalRoad.className = "vertical-road";
                container.appendChild(verticalRoad);
              }
            }
          }
        });
    }

    // Dynamic Color toggling without page refresh
    function toggleSlotDOM(slotId, slotNumber, action) {
      const slotElement = document.getElementById(`slot-${slotId}`);
      if (!slotElement) return;

      if (action === "book") {
        slotElement.className = "slot locked-by-me";
        slotElement.querySelector(".slot-state").textContent = "Your Slot";
        showToast(`Slot ${slotNumber} is now booked and locked for you!`);
      } else if (action === "release") {
        slotElement.className = "slot available";
        slotElement.querySelector(".slot-state").textContent = "Available";
        // Re-bind booking click
        slotElement.onclick = () => triggerSlotBooking(slotId, slotNumber);
        showToast(`Slot ${slotNumber} released successfully!`);
      }
    }

    function triggerSlotBooking(slotId, slotNumber) {
      if (!userId) {
        // Guest Flow
        customPrompt("Guest Booking Details", "Please enter your name to complete the reservation:")
          .then(guestName => {
            if (!guestName) return;
            
            fetch(`/api/mall-bookings/guest?guestName=${encodeURIComponent(guestName)}&mallId=${mallId}&slotId=${slotId}`, {
              method: "POST"
            })
            .then(res => {
              if (!res.ok) throw new Error();
              return res.json();
            })
            .then(booking => {
              // Cache guest booking locally
              const cached = JSON.parse(localStorage.getItem("guestActiveBookingIds") || "[]");
              cached.push(booking.id);
              localStorage.setItem("guestActiveBookingIds", JSON.stringify(cached));
              
              myActiveBookings.push(booking);
              toggleSlotDOM(slotId, slotNumber, "book");
              
              // Bind manager click
              const slotElement = document.getElementById(`slot-${slotId}`);
              if (slotElement) slotElement.onclick = () => openBookingManager(booking.id, slotId, slotNumber);
            })
            .catch(() => showToast("Booking failed. The slot may have been taken.", "error"));
          });
      } else {
        // Registered User Flow
        customConfirm("Confirm Reservation", `Do you want to book and lock parking slot ${slotNumber}?`)
          .then(agreed => {
            if (!agreed) return;

            fetch(`/api/mall-bookings?userId=${userId}&mallId=${mallId}&slotId=${slotId}`, {
              method: "POST"
            })
            .then(res => {
              if (!res.ok) throw new Error();
              return res.json();
            })
            .then(booking => {
              myActiveBookings.push(booking);
              toggleSlotDOM(slotId, slotNumber, "book");
              
              // Bind manager click
              const slotElement = document.getElementById(`slot-${slotId}`);
              if (slotElement) slotElement.onclick = () => openBookingManager(booking.id, slotId, slotNumber);
            })
            .catch(() => showToast("Booking failed. The slot may have been taken.", "error"));
          });
      }
    }

    // Direct active booking release/completion manager from map
    function openBookingManager(bookingId, slotId, slotNumber) {
      customConfirm("Manage Active Booking", `You have already locked slot ${slotNumber}. Would you like to check out / release this slot now?`)
        .then(release => {
          if (!release) return;

          fetch(`/api/mall-bookings/complete/${bookingId}`, {
            method: "POST"
          })
          .then(res => {
            if (!res.ok) throw new Error();
            
            // Remove from active bookings array
            myActiveBookings = myActiveBookings.filter(b => b.id !== bookingId);
            
            // Dynamically toggle slots locally to green
            toggleSlotDOM(slotId, slotNumber, "release");
          })
          .catch(() => showToast("Failed to complete check out.", "error"));
        });
    }

    function handleLogout() {
      customConfirm("Logout", "Are you sure you want to sign out?")
        .then(agreed => {
          if (!agreed) return;
          fetch("/api/users/logout", { method: "POST" })
            .then(() => {
              localStorage.removeItem("userId");
              localStorage.removeItem("userEmail");
              localStorage.removeItem("selectedMallId");
              window.location.href = "index.html";
            })
            .catch(() => {
              localStorage.removeItem("userId");
              localStorage.removeItem("userEmail");
              localStorage.removeItem("selectedMallId");
              window.location.href = "index.html";
            });
        });
    }

    function viewBookings() {
      window.location.href = "mall-bookings.html";
    }
  </script>
