<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Interactive Parking Map - ParkWave</title>
  <!-- Google Fonts & Lucide CDN -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      /* Theme variables - DEFAULT DARK (Uber Pure Black) */
      --bg-color: #000000;
      --card-bg: #121212;
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #ffffff;
      --text-muted: #a0a0a0;
      --accent: #276EF1; /* Uber Royal Blue */
      --accent-light: #5B92FF;
      --success: #10B981;
      --success-bg: rgba(16, 185, 129, 0.1);
      --danger: #EF4444;
      --danger-bg: rgba(239, 68, 68, 0.1);
      
      --ribbon-bg: #121212;
      --ribbon-border: rgba(255, 255, 255, 0.08);
      
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      --font-family: 'Plus Jakarta Sans', sans-serif;
    }

    html.light {
      /* LIGHT THEME */
      --bg-color: #ffffff;
      --card-bg: #f6f6f6;
      --card-border: rgba(0, 0, 0, 0.08);
      --text-main: #000000;
      --text-muted: #5f5f5f;
      --accent: #000000;
      --accent-light: #333333;
      --success: #10B981;
      --success-bg: rgba(16, 185, 129, 0.08);
      --danger: #EF4444;
      --danger-bg: rgba(239, 68, 68, 0.08);
      
      --ribbon-bg: #ffffff;
      --ribbon-border: rgba(0, 0, 0, 0.08);
      
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0c0d12;
      font-family: var(--font-family);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background-color 0.3s ease;
      overflow: hidden;
    }

    html.light body {
      background-color: #f0f2f5;
    }

    .app-shell {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      position: relative;
      background-color: var(--bg-color);
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
    }

    html.light .app-shell {
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.12);
    }

    .app-header {
      height: 64px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      border-bottom: 1px solid var(--card-border);
      z-index: 10;
      flex-shrink: 0;
    }

    .app-header .logo {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.3rem;
      letter-spacing: -0.03em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-car {
      background: var(--accent);
      color: #ffffff;
      padding: 6px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.3s ease;
    }

    html.light .logo-car {
      background: #000000;
    }

    .theme-toggle {
      background: transparent;
      border: none;
      color: var(--text-main);
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      border-radius: 8px;
      transition: background-color 0.2s ease;
    }

    .app-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      padding-bottom: 92px;
      -webkit-overflow-scrolling: touch;
    }

    .app-content::-webkit-scrollbar {
      display: none;
    }

    .mall-title-info {
      margin-bottom: 16px;
    }

    .mall-title-info h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 2px;
    }

    .mall-title-info p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Level Tabs Row */
    .level-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 16px;
      padding-bottom: 4px;
    }

    .level-tabs::-webkit-scrollbar {
      display: none;
    }

    .level-tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .level-tab-btn.active {
      background: var(--text-main);
      color: var(--bg-color);
      border-color: var(--text-main);
    }

    /* Legend layout */
    .legend-row {
      display: flex;
      justify-content: space-between;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    /* Map Zone Frame */
    .map-frame {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 18px 14px;
      margin-bottom: 20px;
    }

    .road-strip {
      height: 24px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.15);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      margin: 12px 0;
      position: relative;
    }
    
    html.light .road-strip {
      background: rgba(0, 0, 0, 0.03);
      color: rgba(0,0,0,0.15);
    }

    .road-strip::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 1px;
      border-top: 1px dashed rgba(255, 255, 255, 0.08);
    }

    html.light .road-strip::after {
      border-top: 1px dashed rgba(0, 0, 0, 0.08);
    }

    /* Mobile Optimized Grid */
    .slots-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .slot-box {
      height: 80px;
      border: 1.5px solid var(--card-border);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .slot-box.available {
      border-color: var(--success);
      background: rgba(16, 185, 129, 0.05);
      color: var(--success);
    }

    .slot-box.available:active {
      background: rgba(16, 185, 129, 0.12);
      transform: scale(0.96);
    }

    .slot-box.booked {
      border-color: var(--card-border);
      color: var(--text-muted);
      opacity: 0.3;
      cursor: not-allowed;
    }

    .slot-box.locked-by-me {
      border-color: var(--accent);
      background: rgba(39, 110, 241, 0.15);
      color: var(--text-main);
      box-shadow: 0 0 12px rgba(39, 110, 241, 0.3);
      animation: pulsePulse 1.8s infinite alternate ease-in-out;
    }

    .slot-box.locked-by-me:active {
      transform: scale(0.96);
    }

    @keyframes pulsePulse {
      0% { border-color: var(--accent); }
      100% { border-color: var(--accent-light); }
    }

    .slot-num {
      font-family: 'Outfit', sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
    }

    .slot-status {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      margin-top: 2px;
      opacity: 0.8;
    }

    .slot-zone {
      font-size: 0.55rem;
      background: rgba(255, 255, 255, 0.1);
      padding: 1px 5px;
      border-radius: 4px;
      margin-top: 4px;
      font-weight: 700;
    }

    html.light .slot-zone {
      background: rgba(0, 0, 0, 0.1);
    }

    /* Fixed Bottom Navigation Ribbon */
    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 72px;
      background-color: var(--ribbon-bg);
      border-top: 1px solid var(--ribbon-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
      box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.25);
      padding-bottom: env(safe-area-inset-bottom);
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--text-muted);
      font-size: 0.65rem;
      font-weight: 600;
      width: 20%;
      height: 100%;
      gap: 4px;
      transition: color 0.2s ease, transform 0.15s ease;
    }

    .nav-item i {
      width: 20px;
      height: 20px;
      stroke-width: 2.2;
    }

    .nav-item.active {
      color: var(--text-main);
    }

    html.light .nav-item.active {
      color: #000000;
    }

    .nav-item.active i {
      color: var(--accent);
      stroke: var(--accent);
    }

    .nav-item:active {
      transform: scale(0.92);
    }

    /* Toast Notification CSS */
    .toast-container {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10000;
      pointer-events: none;
    }

    .toast-message {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 12px 16px;
      border-radius: 12px;
      color: var(--text-main);
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
      animation: slideDown 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .toast-message.success { border-color: var(--success); }
    .toast-message.error { border-color: var(--danger); }

    @keyframes slideDown {
      0% { transform: translateY(-30px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    @keyframes slideUp {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-30px); opacity: 0; }
    }

    /* Premium bottom sheet confirm dialog */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      z-index: 9999;
      display: none;
      align-items: flex-end;
    }

    .modal-sheet {
      background: var(--card-bg);
      border-top: 1px solid var(--card-border);
      border-radius: 24px 24px 0 0;
      width: 100%;
      padding: 24px 20px;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.4);
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-sheet.open {
      transform: translateY(0);
    }

    .sheet-handle {
      width: 40px;
      height: 4px;
      background: var(--card-border);
      border-radius: 2px;
      margin: 0 auto 18px auto;
    }

    .sheet-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.2rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .sheet-text {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .sheet-input-wrapper {
      margin-bottom: 20px;
    }

    .sheet-input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 12px 14px;
      border-radius: 12px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.95rem;
    }

    .sheet-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .sheet-actions {
      display: flex;
      gap: 12px;
    }

    .sheet-btn {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      text-align: center;
      transition: background-color 0.2s ease;
    }

    .sheet-btn-secondary {
      background: var(--card-border);
      color: var(--text-main);
    }

    .sheet-btn-primary {
      background: var(--text-main);
      color: var(--bg-color);
    }
  </style>
</head>
<body>

  <div class="app-shell">
    
    <div class="toast-container" id="toast-container"></div>

    <!-- Bottom sheet Confirm Overlay -->
    <div class="modal-overlay" id="custom-sheet-overlay">
      <div class="modal-sheet" id="custom-sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-title" id="custom-sheet-title">Confirm Action</div>
        <div class="sheet-text" id="custom-sheet-text">Are you sure you want to proceed?</div>
        
        <div class="sheet-input-wrapper" id="custom-sheet-input-container" style="display: none;">
          <input type="text" id="custom-sheet-input" class="sheet-input" placeholder="Your Name">
        </div>

        <div class="sheet-actions">
          <button class="sheet-btn sheet-btn-secondary" onclick="handleSheetAction(false)">Cancel</button>
          <button class="sheet-btn sheet-btn-primary" onclick="handleSheetAction(true)">Confirm</button>
        </div>
      </div>
    </div>

    <header class="app-header">
      <div class="logo" onclick="window.location.href='index.html'" style="cursor: pointer;">
        <span class="logo-car">
          <i data-lucide="car" style="width: 18px; height: 18px; stroke-width: 2.5;"></i>
        </span>
        ParkWave
      </div>
      <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Theme">
        <i data-lucide="sun" id="theme-icon-sun" style="display: none;"></i>
        <i data-lucide="moon" id="theme-icon-moon"></i>
      </button>
    </header>

    <main class="app-content">
      
      <div class="mall-title-info">
        <h2 id="mall-name-el">Loading Mall...</h2>
        <p id="mall-details-el">Retrieving parameters...</p>
      </div>

      <!-- Floor levels slider tabs -->
      <div class="level-tabs" id="level-tabs-container"></div>

      <!-- Colors explanation legends -->
      <div class="legend-row">
        <div class="legend-item">
          <span class="legend-dot" style="background: var(--success);"></span>
          <span>Available</span>
        </div>
        <div class="legend-item">
          <span class="legend-dot" style="background: var(--card-border); opacity: 0.5;"></span>
          <span>Occupied</span>
        </div>
        <div class="legend-item">
          <span class="legend-dot" style="background: var(--accent);"></span>
          <span>Your Slot</span>
        </div>
      </div>

      <!-- Floor map content grid -->
      <div class="map-frame">
        <div class="road-strip">ENTRANCE ROUTE</div>
        
        <div class="slots-grid" id="slots-grid-container">
          <div style="text-align: center; color: var(--text-muted); padding: 40px; grid-column: 1/-1;">Rendering slot grids...</div>
        </div>

        <div class="road-strip">EXIT HIGHWAY</div>
      </div>

    </main>

    <!-- Bottom Ribbon Navigation -->
    <nav class="bottom-nav">
      <a href="index.html" class="nav-item" id="nav-home">
        <i data-lucide="home"></i>
        <span>Home</span>
      </a>
      <a href="mall-selection.html" class="nav-item" id="nav-search">
        <i data-lucide="search"></i>
        <span>Search</span>
      </a>
      <a href="mall-parking.html" class="nav-item active" id="nav-book">
        <i data-lucide="map-pin"></i>
        <span>Book Slots</span>
      </a>
      <a href="mall-bookings.html" class="nav-item" id="nav-history">
        <i data-lucide="calendar"></i>
        <span>History</span>
      </a>
      <a href="profile.html" class="nav-item" id="nav-profile">
        <i data-lucide="user"></i>
        <span>Profile</span>
      </a>
    </nav>

  </div>

  <script>
    const mallId = localStorage.getItem("selectedMallId");
    const userId = localStorage.getItem("userId");
    
    // Redirect if no selected mall
    if (!mallId) {
      window.location.href = "mall-selection.html";
    }

    let currentLevel = 1;
    let myActiveBookings = [];
    let localSlots = [];

    // Theme controls
    function initTheme() {
      const savedTheme = localStorage.getItem("theme") || "dark";
      const htmlEl = document.documentElement;
      const sunIcon = document.getElementById("theme-icon-sun");
      const moonIcon = document.getElementById("theme-icon-moon");

      if (savedTheme === "light") {
        htmlEl.classList.add("light");
        if (sunIcon) sunIcon.style.display = "block";
        if (moonIcon) moonIcon.style.display = "none";
      } else {
        htmlEl.classList.remove("light");
        if (sunIcon) sunIcon.style.display = "none";
        if (moonIcon) moonIcon.style.display = "block";
      }
    }
    initTheme();

    function toggleTheme() {
      const htmlEl = document.documentElement;
      const sunIcon = document.getElementById("theme-icon-sun");
      const moonIcon = document.getElementById("theme-icon-moon");

      if (htmlEl.classList.contains("light")) {
        htmlEl.classList.remove("light");
        localStorage.setItem("theme", "dark");
        if (sunIcon) sunIcon.style.display = "none";
        if (moonIcon) moonIcon.style.display = "block";
        showToast("Switched to Premium Dark Mode");
      } else {
        htmlEl.classList.add("light");
        localStorage.setItem("theme", "light");
        if (sunIcon) sunIcon.style.display = "block";
        if (moonIcon) moonIcon.style.display = "none";
        showToast("Switched to Clean Light Mode");
      }
    }

    // Dynamic initial page loading
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      syncSessionAndLoad();
    });

    function syncSessionAndLoad() {
      const fetchUrl = userId ? `/api/mall-bookings/user/${userId}/active` : `/api/mall-bookings/mall/${mallId}`;

      fetch(fetchUrl)
        .then(res => res.json())
        .then(data => {
          if (userId) {
            myActiveBookings = data;
          } else {
            // Guest active filter
            const cachedIds = JSON.parse(localStorage.getItem("guestActiveBookingIds") || "[]");
            myActiveBookings = data.filter(b => b.status === "ACTIVE" && cachedIds.includes(b.id));
          }

          // Fetch Mall Details
          return fetch(`/api/malls/${mallId}`);
        })
        .then(res => res.json())
        .then(mall => {
          document.getElementById("mall-name-el").textContent = mall.name;
          document.getElementById("mall-details-el").textContent = `${mall.location} • Total: ${mall.totalSlots} slots`;
          
          buildLevelTabs(mall.parkingLevels);
          loadParkingSlots(currentLevel);
        })
        .catch(() => showToast("Failed to lock secure telemetry map. Reload.", "error"));
    }

    function buildLevelTabs(levelsCount) {
      const container = document.getElementById("level-tabs-container");
      container.innerHTML = "";

      for (let i = 1; i <= levelsCount; i++) {
        const btn = document.createElement("button");
        btn.className = `level-tab-btn ${i === currentLevel ? 'active' : ''}`;
        btn.textContent = `Floor ${i}`;
        btn.onclick = () => {
          currentLevel = i;
          document.querySelectorAll(".level-tab-btn").forEach((el, idx) => {
            el.className = `level-tab-btn ${idx + 1 === i ? 'active' : ''}`;
          });
          loadParkingSlots(i);
        };
        container.appendChild(btn);
      }
    }

    // Grid rendering logic - Static toggle class bindings
    function loadParkingSlots(level) {
      fetch(`/api/mall-parking/slots/${mallId}/level/${level}`)
        .then(res => res.json())
        .then(slots => {
          localSlots = slots;
          const container = document.getElementById("slots-grid-container");
          container.innerHTML = "";

          slots.forEach(slot => {
            const activeBooking = myActiveBookings.find(b => b.parkingSlot.id === slot.id && b.status === "ACTIVE");

            let statusClass = "available";
            let statusLabel = "Available";

            if (activeBooking) {
              statusClass = "locked-by-me";
              statusLabel = "Your Lock";
            } else if (slot.status === "BOOKED") {
              statusClass = "booked";
              statusLabel = "Occupied";
            }

            const box = document.createElement("div");
            box.className = `slot-box ${statusClass}`;
            box.id = `slot-${slot.id}`;

            box.innerHTML = `
              <div class="slot-num">${slot.slotNumber}</div>
              <div class="slot-status">${statusLabel}</div>
              <div class="slot-zone">${slot.zone}</div>
            `;

            // Setup dynamic static binds
            if (activeBooking) {
              box.onclick = () => releaseSlotManager(activeBooking.id, slot.id, slot.slotNumber);
            } else if (slot.status === "AVAILABLE") {
              box.onclick = () => bookSlotManager(slot.id, slot.slotNumber);
            } else {
              box.onclick = () => showToast(`Slot ${slot.slotNumber} occupied by another customer.`, "error");
            }

            container.appendChild(box);
          });
        });
    }

    // Toggle color changes without drawing from scratch
    function toggleSlotDOM(slotId, slotNumber, action, booking = null) {
      const el = document.getElementById(`slot-${slotId}`);
      if (!el) return;

      if (action === "book") {
        el.className = "slot-box locked-by-me";
        el.querySelector(".slot-status").textContent = "Your Lock";
        el.onclick = () => releaseSlotManager(booking.id, slotId, slotNumber);
        showToast(`Slot ${slotNumber} locked successfully!`);
      } else if (action === "release") {
        el.className = "slot-box available";
        el.querySelector(".slot-status").textContent = "Available";
        el.onclick = () => bookSlotManager(slotId, slotNumber);
        showToast(`Slot ${slotNumber} released successfully!`);
      }
    }

    // Booking operation manager
    function bookSlotManager(slotId, slotNumber) {
      if (!userId) {
        // Guest layout Flow
        showCustomPrompt("Guest Slot Reservation", `Enter name to lock and secure slot ${slotNumber}:`)
          .then(guestName => {
            if (!guestName) return;

            fetch(`/api/mall-bookings/guest?guestName=${encodeURIComponent(guestName)}&mallId=${mallId}&slotId=${slotId}`, {
              method: "POST"
            })
            .then(res => {
              if (!res.ok) throw new Error();
              return res.json();
            })
            .then(booking => {
              const cached = JSON.parse(localStorage.getItem("guestActiveBookingIds") || "[]");
              cached.push(booking.id);
              localStorage.setItem("guestActiveBookingIds", JSON.stringify(cached));

              myActiveBookings.push(booking);
              toggleSlotDOM(slotId, slotNumber, "book", booking);
            })
            .catch(() => showToast("Booking failed. The slot may have been secured by another user.", "error"));
          });
      } else {
        // Registered User Flow
        showCustomConfirm("Lock Parking Space", `Would you like to reserve slot ${slotNumber}?`)
          .then(agreed => {
            if (!agreed) return;

            fetch(`/api/mall-bookings?userId=${userId}&mallId=${mallId}&slotId=${slotId}`, {
              method: "POST"
            })
            .then(res => {
              if (!res.ok) throw new Error();
              return res.json();
            })
            .then(booking => {
              myActiveBookings.push(booking);
              toggleSlotDOM(slotId, slotNumber, "book", booking);
            })
            .catch(() => showToast("Booking failed. Slot occupied.", "error"));
          });
      }
    }

    // Checkout / Release active slot booking
    function releaseSlotManager(bookingId, slotId, slotNumber) {
      showCustomConfirm("Manage Slot Lock", `You have locked slot ${slotNumber}. Would you like to release this slot and complete checkout?`)
        .then(agreed => {
          if (!agreed) return;

          fetch(`/api/mall-bookings/complete/${bookingId}`, {
            method: "POST"
          })
          .then(res => {
            if (!res.ok) throw new Error();
            
            myActiveBookings = myActiveBookings.filter(b => b.id !== bookingId);
            toggleSlotDOM(slotId, slotNumber, "release");
          })
          .catch(() => showToast("Checkout request failed. Try again.", "error"));
        });
    }

    // Custom Bottom Sheets Engine
    let sheetResolver = null;
    let promptMode = false;

    function showCustomConfirm(title, text) {
      promptMode = false;
      document.getElementById("custom-sheet-title").textContent = title;
      document.getElementById("custom-sheet-text").textContent = text;
      document.getElementById("custom-sheet-input-container").style.display = "none";
      
      const overlay = document.getElementById("custom-sheet-overlay");
      const sheet = document.getElementById("custom-sheet");
      overlay.style.display = "flex";
      setTimeout(() => sheet.classList.add("open"), 10);
      
      return new Promise((resolve) => {
        sheetResolver = resolve;
      });
    }

    function showCustomPrompt(title, text) {
      promptMode = true;
      document.getElementById("custom-sheet-title").textContent = title;
      document.getElementById("custom-sheet-text").textContent = text;
      document.getElementById("custom-sheet-input-container").style.display = "block";
      document.getElementById("custom-sheet-input").value = "";
      
      const overlay = document.getElementById("custom-sheet-overlay");
      const sheet = document.getElementById("custom-sheet");
      overlay.style.display = "flex";
      setTimeout(() => sheet.classList.add("open"), 10);
      
      return new Promise((resolve) => {
        sheetResolver = resolve;
      });
    }

    function handleSheetAction(confirmed) {
      const sheet = document.getElementById("custom-sheet");
      const overlay = document.getElementById("custom-sheet-overlay");
      
      sheet.classList.remove("open");
      setTimeout(() => {
        overlay.style.display = "none";
        if (sheetResolver) {
          if (confirmed) {
            if (promptMode) {
              const val = document.getElementById("custom-sheet-input").value.trim();
              sheetResolver(val || null);
            } else {
              sheetResolver(true);
            }
          } else {
            sheetResolver(null);
          }
        }
      }, 300);
    }

    // Custom Toast Engine
    function showToast(message, type = "success") {
      let container = document.getElementById("toast-container");
      const toast = document.createElement("div");
      toast.className = `toast-message ${type}`;
      
      const iconName = type === 'success' ? 'check-circle' : 'alert-circle';
      const color = type === 'success' ? 'var(--success)' : 'var(--danger)';
      
      toast.innerHTML = `
        <i data-lucide="${iconName}" style="color: ${color}; width: 18px; height: 18px; flex-shrink:0;"></i>
        <span>${message}</span>
      `;
      container.appendChild(toast);
      lucide.createIcons();

      setTimeout(() => {
        toast.style.animation = "slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards";
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }
  </script>
</body>
</html>
